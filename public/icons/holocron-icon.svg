<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Project Holocron">
  <!-- PLACEHOLDER app icon (ruling sheet-immersive-table-mode-brief Addendum 1 web-app-manifest lap).
       Full-bleed background so it works as a maskable icon (OS applies the rounding/mask); the mark sits
       inside the center safe zone. A glowing isometric cube = a Jedi holocron. Swap this file for the real
       logo when brand identity is decided — no manifest/head changes needed. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#122a45"/>
      <stop offset="55%" stop-color="#0a1627"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="#5AB0FF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- isometric cube silhouette (hexagon) -->
    <path d="M256 136 L360 196 L360 316 L256 376 L152 316 L152 196 Z"/>
    <!-- three inner edges from the center → the classic cube -->
    <path d="M256 256 L256 136 M256 256 L152 316 M256 256 L360 316" stroke-width="10"/>
  </g>
  <!-- a faint core glow -->
  <circle cx="256" cy="256" r="10" fill="#BFE4FF" opacity="0.9"/>
</svg>
