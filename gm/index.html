  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%; width: 100%;
      overflow: hidden; background: #000;
      touch-action: none;
    }
    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* — Portrait lock —
       Only trigger on touch devices in landscape with a small viewport
       (i.e. phones held sideways). Desktop browsers always report
       landscape and would otherwise be blocked entirely; tablets in
       landscape are usable. Matches player/index.html:62 convention. */
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
      body::after {
        content: ''; position: fixed; inset: 0;
        background: #000; z-index: 9999;
      }
      body::before {
        content: 'Rotate to portrait to continue';
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-size: 13px;
        letter-spacing: 0.15em; color: rgba(78,170,255,0.6);
        text-align: center; padding: 32px;
      }
    }

    /* — Ken Burns pans — */
    @keyframes kb1 {
      0%   { transform: scale(1.08) translate(0%, 0%); }
      100% { transform: scale(1.35) translate(-9%, 5%); }
    }
    @keyframes kb2 {
      0%   { transform: scale(1.30) translate(-7%, -4%); }
      100% { transform: scale(1.08) translate(12%, 4%); }
    }
    @keyframes kb3 {
      0%   { transform: scale(1.10) translate(8%, 3%); }
      100% { transform: scale(1.35) translate(-7%, -5%); }
    }
    @keyframes kb4 {
      0%   { transform: scale(1.28) translate(-4%, 3%); }
      100% { transform: scale(1.10) translate(5%, -4%); }
    }

    /* — Wipe transitions — */
    @keyframes wipeHorizontal {
      from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
      to   { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
    }
    @keyframes wipeDiagonal {
      from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
      to   { clip-path: polygon(0 0, 100% 0, 160% 100%, 0 100%); }
    }
    @keyframes wipeIris {
      from { clip-path: circle(0% at 50% 50%); }
      to   { clip-path: circle(150% at 50% 50%); }
    }

    /* — Misc — */
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes scanline {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(200%); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(0);    opacity: 1; }
      to   { transform: translateY(100%); opacity: 0; }
    }
    @keyframes fadeOut {
      from { opacity: 1; } to { opacity: 0; }
    }
    @keyframes intelEmber {
      0%   { opacity: 0.35; filter: blur(3px); transform: translateX(-2%) translateY(0); }
      15%  { opacity: 0.7;  filter: blur(5px); transform: translateX(1%)  translateY(-3px); }
      30%  { opacity: 0.5;  filter: blur(3px); transform: translateX(-1%) translateY(-1px); }
      45%  { opacity: 0.9;  filter: blur(6px); transform: translateX(0%)  translateY(-4px); }
      60%  { opacity: 0.6;  filter: blur(4px); transform: translateX(2%)  translateY(-2px); }
      75%  { opacity: 0.8;  filter: blur(6px); transform: translateX(-1%) translateY(-3px); }
      90%  { opacity: 0.45; filter: blur(4px); transform: translateX(1%)  translateY(-1px); }
      100% { opacity: 0.35; filter: blur(3px); transform: translateX(-2%) translateY(0); }
    }
    @keyframes slotGlow {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50% { box-shadow: 0 0 12px 2px var(--slot-glow-color, rgba(176,128,255,0.3)); }
    }
    @keyframes slotSwapPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255,210,74,0.55), inset 0 0 8px rgba(255,210,74,0.18); }
      50%      { box-shadow: 0 0 18px rgba(255,210,74,0.95), inset 0 0 12px rgba(255,210,74,0.35); }
    }
    /* A3 — WCAG 2.4.7 Focus Visible. Every inline-styled button declares
       outline:none; without this rule, keyboard users have no focus signal. */
    button:focus-visible,
    a:focus-visible,
    [role="button"]:focus-visible,
    [tabindex]:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
